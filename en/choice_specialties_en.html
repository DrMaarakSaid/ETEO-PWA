<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ETEO - Choose a Specialty</title>
    
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        .specialties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin: 20px 0 30px;
            text-align: left;
        }
        
        .specialty-card {
            padding: 14px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            background: white;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            text-align: center;
            color: #2c3e50;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            position: relative;
        }
        
        .specialty-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border-color: #667eea;
        }
        
        .specialty-card.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.25);
        }
        
        .specialty-card .emoji {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 4px;
        }
        
        .specialty-card .category-badge {
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 0.6rem;
            opacity: 0.5;
        }
        
        .specialty-card .last-visited-badge {
            position: absolute;
            bottom: 6px;
            right: 8px;
            font-size: 0.55rem;
            background: rgba(102, 126, 234, 0.15);
            padding: 2px 8px;
            border-radius: 12px;
            color: #667eea;
        }
        
        .specialty-card.last-visited {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        
        .specialty-card .specialty-name {
            display: block;
            margin-top: 4px;
        }
        
        .specialty-card .specialty-score {
            display: block;
            font-size: 0.7rem;
            color: #888;
            margin-top: 2px;
        }
        
        .specialty-card.active .specialty-score {
            color: rgba(255, 255, 255, 0.8);
        }
        
        .filter-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 30px;
            background: transparent;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c3e50;
            transition: all 0.3s ease;
        }
        
        .filter-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        
        .filter-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        
        .specialties-search {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            font-size: 0.95rem;
            width: 100%;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            background: white;
        }
        
        .specialties-search:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .specialties-stats {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        
        .stat-divider {
            color: #ddd;
        }
        
        .selected-count {
            font-weight: 600;
            color: #667eea;
        }
        
        @media (max-width: 520px) {
            .specialties-grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 10px;
            }
            
            .specialty-card {
                font-size: 0.75rem;
                padding: 10px 8px;
            }
            
            .specialty-card .emoji {
                font-size: 1.2rem;
            }
            
            .filter-container {
                gap: 6px;
            }
            
            .filter-btn {
                font-size: 0.7rem;
                padding: 6px 12px;
            }
            
            .specialties-stats {
                font-size: 0.7rem;
                gap: 8px;
            }
        }
        
        @media (max-width: 400px) {
            .specialties-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 8px;
            }
            
            .specialty-card {
                font-size: 0.7rem;
                padding: 8px 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- ============================================================ -->
        <!-- NAVIGATION -->
        <!-- ============================================================ -->
        <div class="nav-top">
            <button class="back-btn" onclick="window.location.href='dashboard_en.html'">
                ← Back
            </button>
            <button class="back-btn" onclick="window.location.href='../index.html'">
                🏠 Home
            </button>
            <button class="back-btn" onclick="window.location.href='progression_en.html'">
                📈 Progress
            </button>
            <button class="back-btn roulette-nav-btn" onclick="window.location.href='roulette_de_l_info_en.html'">
                🎰 Info Roulette
            </button>
        </div>

        <!-- ============================================================ -->
        <!-- HEADER -->
        <!-- ============================================================ -->
        <div class="form-header">
            <h1>📚 Choose a Specialty</h1>
            <p>Hello <span id="userNameDisplay">Doctor</span>, choose your specialty to start your ETEO journey!</p>
        </div>

        <!-- ============================================================ -->
        <!-- AI WELCOME MESSAGE -->
        <!-- ============================================================ -->
        <div class="ia-greeting" id="iaGreeting" style="margin-bottom: 20px; background: rgba(102,126,234,0.08); border-radius: 16px; padding: 14px 18px; display: flex; align-items: flex-start; gap: 14px; border-left: 4px solid #667eea;">
            <div class="ia-avatar" style="font-size: 2rem; flex-shrink: 0;">🤖</div>
            <div style="flex: 1;">
                <p class="ia-message" id="iaSpecialtiesMessage" style="font-size: 0.92rem; line-height: 1.6; margin: 0; color: #2c3e50;">
                    Loading message...
                </p>
                <button class="listen-btn-small" id="listenSpecialtiesBtn" style="margin-top: 8px; padding: 4px 14px; font-size: 0.75rem; background: rgba(102,126,234,0.15); border: none; border-radius: 20px; color: #667eea; cursor: pointer;">
                    🔊 Listen
                </button>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- STATISTICS -->
        <!-- ============================================================ -->
        <div class="specialties-stats" id="specialtiesStats">
            <span>📚 <span id="totalSpecialties">36</span> specialties available</span>
            <span class="stat-divider">|</span>
            <span>🔄 Last visited : <span id="lastVisited">None</span></span>
            <span class="stat-divider">|</span>
            <span>📊 Score : <span id="userScore">0%</span></span>
        </div>

        <!-- ============================================================ -->
        <!-- FILTERS -->
        <!-- ============================================================ -->
        <div class="filter-container" id="filterContainer">
            <button class="filter-btn active" data-filter="all">🔍 All</button>
            <button class="filter-btn" data-filter="clinique">🏥 Clinical</button>
            <button class="filter-btn" data-filter="technique">🔬 Technical</button>
            <button class="filter-btn" data-filter="gestion">📊 Management</button>
            <button class="filter-btn" data-filter="rh">👥 HR</button>
            <button class="filter-btn" data-filter="sciences">🧬 Sciences</button>
        </div>

        <!-- ============================================================ -->
        <!-- SEARCH -->
        <!-- ============================================================ -->
        <input type="text" class="specialties-search" id="searchInput" placeholder="🔍 Search for a specialty...">

        <!-- ============================================================ -->
        <!-- SPECIALTIES GRID -->
        <!-- ============================================================ -->
        <div class="specialties-grid" id="specialtiesGrid">
            <!-- Filled by JavaScript -->
        </div>

        <!-- ============================================================ -->
        <!-- COUNTER -->
        <!-- ============================================================ -->
        <div style="text-align: center; font-size: 0.85rem; color: #888; margin-top: 10px;">
            <span id="selectedCount">0</span> specialty(ies) selected
        </div>

        <!-- ============================================================ -->
        <!-- ACTIONS -->
        <!-- ============================================================ -->
        <div class="actions" style="margin-top: 20px;">
            <button class="validate-btn" id="startQuizBtn" disabled>
                🚀 Start the quiz
            </button>
        </div>

        <!-- ============================================================ -->
        <!-- FOOTER -->
        <!-- ============================================================ -->
        <div class="footer">
            <p>© 2026 - Dr. SAID MAARAK 🇲🇦</p>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- TOAST -->
    <!-- ============================================================ -->
    <div class="toast" id="toast"></div>

    <!-- ============================================================ -->
    <!-- MAIN SCRIPT -->
    <!-- ============================================================ -->
    
    <script type="module">
        // ============================================================
        // IMPORTS
        // ============================================================
        
        import { Logger } from '../js/logger.js';
        import { StorageService } from '../js/services/storage.js';
        import { SPECIALTIES, CATEGORY_LABELS } from '../js/config.js';
        import tts from '../js/services/tts.js';
        
        window.tts = tts;
        
        // ============================================================
        // DOM ELEMENTS
        // ============================================================
        
        const toast = document.getElementById('toast');
        const specialtiesGrid = document.getElementById('specialtiesGrid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const startQuizBtn = document.getElementById('startQuizBtn');
        const selectedCount = document.getElementById('selectedCount');
        const totalSpecialties = document.getElementById('totalSpecialties');
        const lastVisited = document.getElementById('lastVisited');
        const userScore = document.getElementById('userScore');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const iaSpecialtiesMessage = document.getElementById('iaSpecialtiesMessage');
        const listenSpecialtiesBtn = document.getElementById('listenSpecialtiesBtn');
        
        // ============================================================
        // STORAGE
        // ============================================================
        
        const storage = new StorageService();
        let selectedSpecialty = null;
        let currentFilter = 'all';
        let searchTerm = '';
        
        // ============================================================
        // TOAST
        // ============================================================
        
        function showToast(message, duration = 2500) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }
        
        // ============================================================
        // CLEAN EMOJIS FOR TTS
        // ============================================================
        
        function cleanTextForTTS(text) {
            if (!text) return '';
            let cleaned = text.replace(/[\u{1F000}-\u{1FFFF}]/gu, '');
            cleaned = cleaned.replace(/[⭐🌟🔥💎🎯🎉💪🧠📚📖🔊✅❌⏰🎰🦷🔪✨🔩👄👶💉🖨️📸📷🧼🔧🏥📊📋💰🏛️📈💻🛡️🌍👩‍⚕️📜🤝⚖️🎓📇👴🧪🎡👆]/g, '');
            cleaned = cleaned.replace(/[""]/g, '"');
            cleaned = cleaned.replace(/['']/g, "'");
            cleaned = cleaned.replace(/\s+/g, ' ').trim();
            return cleaned;
        }
        
        // ============================================================
        // READ URL PARAMETER
        // ============================================================
        
        function getUrlParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }
        
        // ============================================================
        // LOAD USER DATA (iOS VERSION)
        // ============================================================
        
        function loadUserData() {
            const settings = storage.getSettings() || {};
            const user = settings.user || {};
            
            // ✅ iOS : displayName with fallback
            const displayName = user.displayName || user.fullName || 'Doctor';
            if (userNameDisplay) {
                userNameDisplay.textContent = displayName;
            }
            
            // Last visited specialty
            if (settings.lastSpecialty) {
                const spec = SPECIALTIES.find(s => s.id === settings.lastSpecialty);
                if (spec) {
                    lastVisited.textContent = spec.name;
                }
            }
            
            // Average score
            const scores = settings.scores || {};
            let totalScore = 0;
            let totalCount = 0;
            for (const [specId, levels] of Object.entries(scores)) {
                if (typeof levels === 'object' && levels !== null) {
                    for (const [level, data] of Object.entries(levels)) {
                        if (data && data.percentage) {
                            totalScore += data.percentage;
                            totalCount++;
                        }
                    }
                }
            }
            if (totalCount > 0) {
                userScore.textContent = Math.round(totalScore / totalCount) + '%';
            }
            
            totalSpecialties.textContent = SPECIALTIES.length;
        }
        
        // ============================================================
        // GENERATE AI MESSAGE
        // ============================================================
        
        async function generateIAMessage() {
            try {
                const settings = storage.getSettings() || {};
                // ✅ iOS : displayName with fallback
                const userName = settings.user?.displayName || settings.user?.fullName || 'Doctor';
                
                const scores = settings.scores || {};
                let recommended = null;
                let lowestScore = 100;
                
                SPECIALTIES.forEach(spec => {
                    const specScores = scores[spec.id] || {};
                    let specTotal = 0;
                    let specCount = 0;
                    for (const [level, data] of Object.entries(specScores)) {
                        if (data && data.percentage) {
                            specTotal += data.percentage;
                            specCount++;
                        }
                    }
                    if (specCount > 0) {
                        const avg = specTotal / specCount;
                        if (avg < lowestScore) {
                            lowestScore = avg;
                            recommended = spec;
                        }
                    }
                });
                
                let message = '';
                let ttsMessage = '';
                
                message = `Hello ${userName}! 👋<br>`;
                message += `Welcome to your ETEO journey. You will discover <strong>${SPECIALTIES.length} dental specialties</strong> that are fascinating.<br>`;
                message += `Each one will bring you new skills and knowledge.<br><br>`;
                ttsMessage = `Hello ${userName}. Welcome to your ETEO journey. You will discover ${SPECIALTIES.length} dental specialties that are fascinating. Each one will bring you new skills and knowledge. `;
                
                if (recommended) {
                    message += `💡 I also suggest you work on <strong>${recommended.emoji} ${recommended.name}</strong>, a specialty where you could make more progress.<br>`;
                    message += `This is a great opportunity to strengthen your skills in this area.<br><br>`;
                    ttsMessage += `I also suggest you work on ${recommended.name}, a specialty where you could make more progress. This is a great opportunity to strengthen your skills in this area. `;
                }
                
                message += `So, which specialty will you start with today? 🚀`;
                ttsMessage += `So, which specialty will you start with today?`;
                
                iaSpecialtiesMessage.innerHTML = message;
                window._ttsSpecialtiesMessage = cleanTextForTTS(ttsMessage);
                
                if (listenSpecialtiesBtn) {
                    listenSpecialtiesBtn.style.display = 'inline-block';
                }
                
                setTimeout(() => {
                    if (window.tts && typeof window.tts.speak === 'function') {
                        const text = window._ttsSpecialtiesMessage || '';
                        if (text) {
                            window.tts.speak(text, 'en', 0.9, 1.0);
                        }
                    }
                }, 1200);
                
            } catch (error) {
                console.error('❌ Error generating AI message:', error);
                iaSpecialtiesMessage.innerHTML = '⚠️ Message not available.';
            }
        }
        
        // ============================================================
        // LISTEN BUTTON
        // ============================================================
        
        listenSpecialtiesBtn.addEventListener('click', function() {
            if (!window.tts || typeof window.tts.speak !== 'function') {
                showToast('❌ TTS not available', 3000);
                return;
            }
            
            if (window.tts.isSpeakingNow && window.tts.isSpeakingNow()) {
                window.tts.stop();
                this.textContent = '🔊 Listen';
                this.classList.remove('listening');
                return;
            }
            
            const text = window._ttsSpecialtiesMessage || '';
            if (!text) {
                showToast('⚠️ Message not available', 3000);
                return;
            }
            
            this.textContent = '⏹️ Stop';
            this.classList.add('listening');
            
            window.tts.speak(
                text,
                'en',
                0.9,
                1.0,
                () => {
                    this.textContent = '🔊 Listen';
                    this.classList.remove('listening');
                },
                (error) => {
                    console.error('❌ TTS error:', error);
                    this.textContent = '🔊 Listen';
                    this.classList.remove('listening');
                    showToast('❌ Voice reading error', 3000);
                }
            );
        });
        
        // ============================================================
        // RENDER SPECIALTIES (SORTED ALPHABETICALLY)
        // ============================================================
        
        function renderSpecialties() {
            const settings = storage.getSettings() || {};
            const scores = settings.scores || {};
            const lastSpecialty = settings.lastSpecialty;
            
            // ✅ ALPHABETICAL SORT
            let filtered = [...SPECIALTIES].sort((a, b) => a.name.localeCompare(b.name));
            
            if (currentFilter !== 'all') {
                filtered = filtered.filter(spec => spec.category === currentFilter);
            }
            
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(spec => 
                    spec.name.toLowerCase().includes(term) ||
                    spec.id.toLowerCase().includes(term)
                );
            }
            
            if (filtered.length === 0) {
                specialtiesGrid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #888;">
                        🔍 No specialty found
                    </div>
                `;
                return;
            }
            
            specialtiesGrid.innerHTML = filtered.map(spec => {
                const isLast = spec.id === lastSpecialty;
                const specScores = scores[spec.id] || {};
                let levelCount = 0;
                let totalPercentage = 0;
                for (const [level, data] of Object.entries(specScores)) {
                    if (data && data.percentage && data.percentage >= 60) {
                        levelCount++;
                        totalPercentage += data.percentage;
                    }
                }
                const avgScore = levelCount > 0 ? Math.round(totalPercentage / levelCount) : 0;
                const isActive = spec.id === selectedSpecialty;
                
                return `
                    <div class="specialty-card ${isActive ? 'active' : ''} ${isLast ? 'last-visited' : ''}" 
                         data-id="${spec.id}" 
                         onclick="selectSpecialty('${spec.id}')">
                        <span class="emoji">${spec.emoji}</span>
                        <span class="specialty-name">${spec.name}</span>
                        <span class="category-badge">${CATEGORY_LABELS[spec.category] || ''}</span>
                        ${isLast ? '<span class="last-visited-badge">🔄 Last</span>' : ''}
                        ${levelCount > 0 ? `<span class="specialty-score">📊 ${avgScore}% (${levelCount}/6)</span>` : ''}
                    </div>
                `;
            }).join('');
        }
        
        // ============================================================
        // SELECT A SPECIALTY
        // ============================================================
        
        window.selectSpecialty = function(id) {
            if (selectedSpecialty === id) {
                selectedSpecialty = null;
            } else {
                selectedSpecialty = id;
            }
            
            const settings = storage.getSettings() || {};
            settings.lastSpecialty = id;
            storage.saveSettings(settings);
            
            updateSelection();
            renderSpecialties();
        };
        
        function updateSelection() {
            if (selectedSpecialty) {
                const spec = SPECIALTIES.find(s => s.id === selectedSpecialty);
                if (spec) {
                    selectedCount.textContent = `1 (${spec.emoji} ${spec.name})`;
                    startQuizBtn.disabled = false;
                    startQuizBtn.textContent = `🚀 Start ${spec.name}`;
                    return;
                }
            }
            selectedCount.textContent = '0';
            startQuizBtn.disabled = true;
            startQuizBtn.textContent = '🚀 Start the quiz';
        }
        
        // ============================================================
        // START THE QUIZ
        // ============================================================
        
        startQuizBtn.addEventListener('click', () => {
            if (!selectedSpecialty) {
                showToast('⚠️ Please select a specialty', 3000);
                return;
            }
            
            const settings = storage.getSettings() || {};
            settings.selectedSpecialty = selectedSpecialty;
            storage.saveSettings(settings);
            
            window.location.href = `quiz_en.html?specialty=${selectedSpecialty}`;
        });
        
        // ============================================================
        // FILTERS
        // ============================================================
        
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderSpecialties();
            });
        });
        
        // ============================================================
        // SEARCH
        // ============================================================
        
        searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value.trim();
            renderSpecialties();
        });
        
        // ============================================================
        // INITIALIZATION
        // ============================================================
        
        function init() {
            Logger.info('📚 Choose specialties page iOS loaded (EN)');
            
            loadUserData();
            renderSpecialties();
            generateIAMessage();
            
            // ✅ AUTO SELECTION FROM URL
            const specialtyParam = getUrlParam('specialty');
            if (specialtyParam) {
                const spec = SPECIALTIES.find(s => s.id === specialtyParam);
                if (spec) {
                    window.selectSpecialty(specialtyParam);
                    setTimeout(() => {
                        const card = document.querySelector(`.specialty-card[data-id="${specialtyParam}"]`);
                        if (card) {
                            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            card.style.transition = 'box-shadow 0.3s ease';
                            card.style.boxShadow = '0 0 0 4px #667eea, 0 8px 30px rgba(102,126,234,0.3)';
                            setTimeout(() => {
                                card.style.boxShadow = '';
                            }, 2000);
                        }
                    }, 300);
                    
                    console.log(`🎯 Specialty automatically selected: ${spec.name}`);
                }
            }
            
            console.log('📚 ETEO iOS - Choose specialties ready (EN)');
            console.log(`📊 ${SPECIALTIES.length} specialties available (sorted alphabetically)`);
            console.log('🔍 Filters and search available');
            console.log('🤖 AI: Personalized message with recommendation');
            console.log('✅ iOS: displayName supported');
        }
        
        init();
        
    </script>
</body>
</html>
