<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎓 认证考试 - ETEO</title>
    
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        /* ============================================================
           证书转盘专用样式
           ============================================================ */
        
        .roulette-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            margin: 10px auto;
            max-width: 400px;
        }
        
        .roulette-wrapper canvas {
            width: 100%;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 4px 30px rgba(0,0,0,0.12);
            display: block;
        }
        
        .roulette-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            filter: drop-shadow(0 0 8px #ff6b00) drop-shadow(0 0 20px #ff6b00);
            animation: pointerPulse 1.5s ease-in-out infinite;
            pointer-events: none;
        }
        
        .roulette-pointer svg {
            width: 30px;
            height: 36px;
            display: block;
        }
        
        @keyframes pointerPulse {
            0% { filter: drop-shadow(0 0 8px #ff6b00) drop-shadow(0 0 20px #ff6b00); }
            50% { filter: drop-shadow(0 0 15px #ff6b00) drop-shadow(0 0 35px #ff6b00) drop-shadow(0 0 60px rgba(255,107,0,0.3)); }
            100% { filter: drop-shadow(0 0 8px #ff6b00) drop-shadow(0 0 20px #ff6b00); }
        }
        
        .roulette-result {
            display: none;
            font-size: 1rem;
            font-weight: 600;
            color: #2c3e50;
            padding: 10px 16px;
            background: #f0f4ff;
            border-radius: 14px;
            border-left: 4px solid #667eea;
            margin: 8px auto;
            max-width: 400px;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            text-align: center;
        }
        
        .roulette-result .highlight {
            color: #667eea;
            font-weight: 800;
        }
        
        .roulette-spin-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #f57c00, #e65100);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(245, 124, 0, 0.3);
            margin: 5px 0;
        }
        
        .roulette-spin-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(245, 124, 0, 0.4);
        }
        
        .roulette-spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            background: #b0b0b0;
            box-shadow: none;
        }
        
        .roulette-replay-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.25);
        }
        
        .roulette-replay-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.35);
        }
        
        .roulette-replay-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .ia-greeting {
            background: linear-gradient(135deg, #e8eeff, #f0f4ff);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 15px;
            color: #2c3e50;
            border: 1px solid #d0d8f0;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            text-align: left;
            box-shadow: 0 2px 12px rgba(102, 126, 234, 0.08);
        }
        
        .ia-avatar {
            font-size: 2.5rem;
            flex-shrink: 0;
            animation: iaPulse 2s ease-in-out infinite;
        }
        
        @keyframes iaPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .ia-message {
            font-size: 0.95rem;
            line-height: 1.8;
            margin: 0;
            color: #2c3e50;
        }
        
        .ia-message strong {
            color: #4c6ef5;
        }
        
        .ia-message .highlight-score {
            color: #4caf50;
            font-weight: 700;
        }
        
        .ia-message .highlight-fail {
            color: #e74c3c;
            font-weight: 700;
        }
        
        .question-progress {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: #f0f4ff;
            border-radius: 30px;
            margin: 10px 0;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .question-progress .progress-bar {
            flex: 1;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin: 0 12px;
            overflow: hidden;
        }
        
        .question-progress .progress-bar .fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .question-counter {
            font-size: 0.85rem;
            font-weight: 700;
            color: #667eea;
            white-space: nowrap;
        }
        
        .certificate-result {
            text-align: center;
            padding: 20px;
        }
        
        .certificate-result .score-big {
            font-size: 4rem;
            font-weight: 800;
            color: #2c3e50;
        }
        
        .certificate-result .score-big .correct {
            color: #4caf50;
        }
        
        .certificate-result .score-big .wrong {
            color: #e74c3c;
        }
        
        .certificate-result .percentage-big {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 10px 0;
        }
        
        .certificate-result .percentage-big.success {
            color: #4caf50;
        }
        
        .certificate-result .percentage-big.fail {
            color: #e74c3c;
        }
        
        .certificate-result .message-big {
            font-size: 1.2rem;
            margin: 15px 0;
            color: #555;
        }
        
        .btn-download-cert {
            padding: 16px 40px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ffd700, #f57c00);
            color: #2c3e50;
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
            margin: 10px 0;
        }
        
        .btn-download-cert:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 35px rgba(255, 215, 0, 0.5);
        }
        
        .btn-retry-cert {
            padding: 14px 35px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 0;
        }
        
        .btn-retry-cert:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.35);
        }
        
        .success-badge {
            display: inline-block;
            background: #ffd700;
            color: #2c3e50;
            padding: 8px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.1rem;
            margin: 10px 0;
            animation: badgePulse 2s ease-in-out infinite;
        }
        
        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .btn-back-specialty {
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #4caf50, #43a047);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }
        
        .btn-back-specialty:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
        }

        #headerContainer {
            text-align: center;
            margin-bottom: 8px;
        }

        #headerContainer h1 {
            font-size: 1.8rem;
            margin: 0;
            color: #2c3e50;
        }

        #specialtyDisplay {
            color: #555;
            font-size: 1.2rem;
            margin: 5px 0;
            font-weight: 600;
        }

        #specialtyDisplay .specialty-name {
            color: #4c6ef5;
            font-weight: 800;
            font-size: 1.3rem;
        }
        
        .payment-lock-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        
        .payment-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .payment-popup {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            animation: popupIn 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        @keyframes popupIn {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        
        .payment-popup h2 {
            color: #2c3e50;
            margin: 10px 0;
        }
        
        .payment-popup p {
            color: #666;
            margin: 10px 0;
            line-height: 1.6;
        }
        
        .payment-popup .features {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
            margin: 15px 0;
            text-align: left;
        }
        
        .payment-popup .features p {
            margin: 4px 0;
            font-size: 0.9rem;
            color: #333;
        }
        
        .payment-popup .pay-btn {
            padding: 14px 40px;
            background: linear-gradient(135deg, #ffd700, #f57c00);
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            color: #2c3e50;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .payment-popup .pay-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
        }
        
        .payment-popup .pay-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .payment-popup .close-btn {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 10px;
            width: 100%;
            transition: color 0.3s ease;
        }
        
        .payment-popup .close-btn:hover {
            color: #333;
        }
        
        .payment-popup .secure-text {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 10px;
        }
        
        @media (max-width: 520px) {
            .ia-greeting {
                padding: 12px 14px;
                gap: 10px;
            }
            .ia-avatar {
                font-size: 2rem;
            }
            .ia-message {
                font-size: 0.85rem;
            }
            .roulette-pointer {
                top: -6px;
            }
            .roulette-pointer svg {
                width: 24px;
                height: 30px;
            }
            .roulette-spin-btn {
                font-size: 0.85rem;
                padding: 10px 20px;
            }
            .roulette-result {
                font-size: 0.85rem;
                padding: 8px 12px;
            }
            .certificate-result .score-big {
                font-size: 3rem;
            }
            .certificate-result .percentage-big {
                font-size: 2rem;
            }
            .question-progress {
                font-size: 0.8rem;
                padding: 6px 12px;
            }
            .btn-download-cert {
                font-size: 1rem;
                padding: 14px 25px;
            }
            #headerContainer h1 {
                font-size: 1.4rem;
            }
            #specialtyDisplay {
                font-size: 1rem;
            }
            #specialtyDisplay .specialty-name {
                font-size: 1.1rem;
            }
            .payment-popup {
                padding: 20px;
            }
        }
        
        @media (max-width: 400px) {
            .ia-avatar {
                font-size: 1.6rem;
            }
            .ia-message {
                font-size: 0.78rem;
            }
            .roulette-pointer {
                top: -4px;
            }
            .roulette-pointer svg {
                width: 20px;
                height: 26px;
            }
            #headerContainer h1 {
                font-size: 1.2rem;
            }
            #specialtyDisplay {
                font-size: 0.9rem;
            }
            #specialtyDisplay .specialty-name {
                font-size: 1rem;
            }
            .payment-popup {
                padding: 15px;
            }
        }
    </style>
    
    <script type="importmap">
    {
        "imports": {
            "../js/": "../js/",

</head>
<body>
    <div class="container quiz-container">
        
        <div class="nav-top">
            <button class="back-btn" onclick="window.location.href='yibiao_zh.html'">📊 仪表盘</button>
            <button class="back-btn" onclick="window.location.href='../index.html'">🏠 首页</button>
        </div>

        <div id="headerContainer">
            <h1>🎓 认证考试</h1>
            <p id="specialtyDisplay">
                专科 : <span class="specialty-name" id="specialtyNameDisplay">加载中...</span>
            </p>
        </div>

        <!-- 屏幕 1 : 转盘 -->
        <div id="rouletteScreen">
            
            <div class="ia-greeting" id="iaGreeting">
                <div class="ia-avatar" id="iaAvatar">🌟</div>
                <p class="ia-message" id="iaMessage">
                    正在加载个性化消息...
                </p>
            </div>

            <div class="question-progress" id="progressContainer">
                <span class="question-counter" id="questionCounter">0 / 50</span>
                <div class="progress-bar">
                    <div class="fill" id="progressFill" style="width: 0%;"></div>
                </div>
                <span id="scoreCounter" style="font-weight:700; color:#4caf50;">✅ 0</span>
            </div>

            <div class="roulette-wrapper">
                <canvas id="rouletteCanvas" width="400" height="400"></canvas>
                <div class="roulette-pointer" id="roulettePointer">
                    <svg viewBox="0 0 30 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <polygon points="15,36 3,0 10,0 15,22 20,0 27,0" fill="#ff6b00" stroke="#ffaa00" stroke-width="2"/>

                        <polygon points="15,28 9,8 12,8 15,18 18,8 21,8" fill="#ffdd00" opacity="0.3"/>

            <div class="tts-button-row">

            </div>
            
            <div class="options" id="optionsContainer"></div>
            
            <div class="feedback-container" id="feedbackContainer" style="display:none;">

                <span class="points-badge" id="pointsBadge"></span>

            <div class="explanation-box" id="explanationBox" style="display:none;">

        </div>

                <div id="resultIaContainer"></div>

                <div id="failContainer" style="display:none;">

        </div>

        <div class="toast" id="toast"></div>

        function cleanTextForTTS(text) {
            if (!text) return '';
            
            let cleaned = text.replace(/[\u{1F000}-\u{1FFFF}]/gu, '');
            cleaned = cleaned.replace(/[⭐🌟🔥💎🎯🎉💪🧠📚📖🔊✅❌⏰🎰🦷🔪✨🔩👄👶💉🖨️📸📷🧼🔧🏥📊📋💰🏛️📈💻🛡️🌍👩‍⚕️📜🤝⚖️🎓📇👴🧪🎡👆🌱🌿🌳🌲]/g, '');
            cleaned = cleaned.replace(/\n/g, ' ');
            cleaned = cleaned.replace(/\r/g, ' ');
            cleaned = cleaned.replace(/\.\s+([A-ZÉÈÊËÀÂÄÔÖÎÏÙÛÜÇ])/g, ', $1');
            cleaned = cleaned.replace(/\.\s+([a-zéèêëàâäôöîïùûüç])/g, ', $1');
            cleaned = cleaned.replace(/\.(\d)/g, '$1');
            cleaned = cleaned.replace(/\.\s*$/, '');
            cleaned = cleaned.replace(/\s\.\s/g, ' ');
            cleaned = cleaned.replace(/\./g, ', ');
            cleaned = cleaned.replace(/,\s*,/g, ',');
            cleaned = cleaned.replace(/,\s*,\s*/g, ', ');
            cleaned = cleaned.replace(/%/g, ' 百分之 ');
            cleaned = cleaned.replace(/[""]/g, '"');
            cleaned = cleaned.replace(/['']/g, "'");
            cleaned = cleaned.replace(/[«»]/g, '"');
            cleaned = cleaned.replace(/\s+/g, ' ').trim();
            
            return cleaned;
        }

            document.querySelectorAll('.tts-btn.listening, .listen-btn.listening').forEach(btn => {

        function speakText(text, button, buttonText = '🔊') {
            if (!window.tts || typeof window.tts.speak !== 'function') {
                if (button) {
                    button.textContent = buttonText;
                    button.classList.remove('listening');
                }
                return;
            }
            
            const cleanText = cleanTextForTTS(text);
            if (!cleanText || cleanText.trim() === '') {
                if (button) {
                    button.textContent = buttonText;
                    button.classList.remove('listening');
                }
                return;
            }
            
            try {
                if (window.tts.isSpeakingNow && window.tts.isSpeakingNow()) {
                    window.tts.stop();
                }
            } catch (e) {}
            
            document.querySelectorAll('.tts-btn.listening, .listen-btn.listening').forEach(btn => {
                const originalText = btn.dataset.originalText || '🔊';
                btn.textContent = originalText;
                btn.classList.remove('listening');

            if (button) {
                button.dataset.originalText = buttonText;
                button.textContent = '⏹️ 停止';
                button.classList.add('listening');
            }
            
            try {

                    }
                );
            } catch (e) {}
        }

        function playRouletteSound(type, totalDuration) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                if (type === 'spin') {
                    if (!totalDuration) totalDuration = 4000;
                    const minTicks = 15;
                    const maxTicks = 35;
                    const totalTicks = Math.min(maxTicks, Math.max(minTicks, Math.floor(totalDuration / 130)));
                    let count = 0;
                    const baseFreq = 523;
                    const volume = 0.15;
                    
                    function playTick() {
                        if (count >= totalTicks) return;
                        const progress = count / totalTicks;
                        const speedFactor = 0.4 + 0.6 * (1 - Math.sin(progress * Math.PI));
                        const tickDelay = (totalDuration / totalTicks) * speedFactor * 0.9;
                        
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        const freqVariation = Math.sin(progress * Math.PI) * 200;
                        osc.frequency.value = baseFreq + freqVariation;
                        osc.type = 'square';
                        gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                        gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.01);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.05);
                        count++;
                        if (count < totalTicks) {
                            setTimeout(playTick, tickDelay);
                        }
                    }
                    setTimeout(playTick, 50);
                    
                } else if (type === 'win') {
                    const notes = [392, 523, 659, 784, 1047];
                    const volume = 0.25;
                    const duration = 0.35;
                    const delay = 140;
                    notes.forEach((freq, i) => {
                        setTimeout(() => {
                            const osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            osc.frequency.value = freq;
                            osc.type = 'square';
                            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                            gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.04);
                            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                            osc.start();
                            osc.stop(audioCtx.currentTime + duration);
                        }, i * delay);
                    });
                    
                } else if (type === 'lose') {
                    const notes = [523, 494, 466, 440];
                    const volume = 0.25;
                    const duration = 0.4;
                    const delay = 140;
                    notes.forEach((freq, i) => {
                        setTimeout(() => {
                            const osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            osc.frequency.value = freq;
                            osc.type = 'square';
                            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                            gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.04);
                            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                            osc.start();
                            osc.stop(audioCtx.currentTime + duration);
                        }, i * delay);
                    });
                    
                } else if (type === 'click') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.value = 1200;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.20, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                    
                } else if (type === 'tada') {
                    const notesTada = [523, 659, 784, 1047, 1318];
                    notesTada.forEach((freq, i) => {
                        setTimeout(() => {
                            const osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            osc.frequency.value = freq;
                            osc.type = 'square';
                            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                            osc.start();
                            osc.stop(audioCtx.currentTime + 0.12);
                        }, i * 100);
                    });
                }
            } catch (e) {}
        }

        async function loadAllQuestionsForSpecialty() {
            try {
                const allQuestions = [];
                
                for (const level of LEVELS) {
                    const path = `../data/zh/${currentSpecialty}/${level.id}.json`;
                    try {
                        const response = await fetch(path);
                        if (!response.ok) {
                            console.warn(`⚠️ 文件未找到：${path}`);
                            continue;
                        }
                        const data = await response.json();
                        if (data.questions && data.questions.length > 0) {
                            allQuestions.push({
                                levelId: level.id,
                                levelLabel: level.label,
                                levelEmoji: level.emoji,
                                questions: data.questions
                            });
                        }
                    } catch (e) {
                        console.warn(`⚠️ 加载 ${path} 时出错：`, e);
                    }
                }
                
                if (allQuestions.length === 0) {
                    showToast('❌ 未找到此专科的题目', 3000);
                    return null;
                }
                
                const selected = [];
                const allQ = [];
                allQuestions.forEach(item => {
                    item.questions.forEach(q => {
                        allQ.push({
                            ...q,
                            _levelId: item.levelId,
                            _levelLabel: item.levelLabel,
                            _levelEmoji: item.levelEmoji
                        });
                    });
                });
                
                for (let i = allQ.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [allQ[i], allQ[j]] = [allQ[j], allQ[i]];
                }
                
                const count = Math.min(50, allQ.length);
                for (let i = 0; i < count; i++) {
                    selected.push(allQ[i]);
                }
                
                while (selected.length < 50) {
                    const idx = selected.length % allQ.length;
                    selected.push({ ...allQ[idx], id: allQ[idx].id + '_dup_' + selected.length });
                }
                
                return selected;
                
            } catch (error) {
                console.error('❌ 加载题目时出错：', error);
                showToast('❌ 加载题目时出错', 3000);
                return null;
            }
        }
        
        // ============================================================
        // 转盘
        // ============================================================
        
        function initRoulette() {
            const canvas = document.getElementById('rouletteCanvas');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) / 2 - 15;
            const segmentAngle = (2 * Math.PI) / LEVELS.length;
            let currentAngle = 0;
            let animationId = null;
            const colors = ['#4caf50', '#8bc34a', '#ff9800', '#f57c00', '#e74c3c', '#9b59b6'];
            
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < LEVELS.length; i++) {
                    const startAngle = currentAngle + i * segmentAngle;
                    const endAngle = startAngle + segmentAngle;
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                    ctx.closePath();
                    ctx.fillStyle = colors[i % colors.length];
                    ctx.fill();
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(startAngle + segmentAngle / 2);
                    ctx.textAlign = 'right';
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 11px Arial';
                    ctx.fillText(LEVELS[i].emoji + ' ' + LEVELS[i].label, radius - 8, 4);
                    ctx.restore();
                }
                ctx.beginPath();
                ctx.arc(centerX, centerY, 18, 0, 2 * Math.PI);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#333';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🎓', centerX, centerY);
            }
            
            function spin(callback) {
                if (isSpinning) return;
                isSpinning = true;
                
                const extraSpins = 2 + Math.random() * 3;
                const targetAngle = currentAngle + extraSpins * 2 * Math.PI + Math.random() * 2 * Math.PI;
                const duration = 3500 + Math.random() * 1500;
                const startTime = Date.now();
                const startAngle = currentAngle;
                
                playRouletteSound('spin', duration);
                
                function animate() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    currentAngle = startAngle + (targetAngle - startAngle) * easeOut;
                    draw();
                    
                    if (progress < 1) {
                        animationId = requestAnimationFrame(animate);
                    } else {
                        currentAngle = targetAngle;
                        draw();
                        isSpinning = false;
                        
                        const normalizedAngle = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
                        const pointerAngle = 3 * Math.PI / 2;
                        const resultAngle = (pointerAngle - normalizedAngle + 2 * Math.PI) % (2 * Math.PI);
                        const index = Math.floor(resultAngle / segmentAngle) % LEVELS.length;
                        
                        const level = LEVELS[index];
                        currentLevel = level.id;
                        selectedLevelDisplay.textContent = `${level.emoji} ${level.label}`;
                        levelResult.style.display = 'flex';
                        playRouletteSound('click');
                        
                        if (callback) callback(level);
                    }
                }
                animate();
            }
            
            draw();
            return { spin, draw, isSpinning: () => isSpinning };
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                timerBottomValue.textContent = timeRemaining;
                if (timeRemaining <= 5) {
                    timerBottom.style.color = '#e74c3c';
                }
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

            clearInterval(timerInterval);
            timerBottom.style.color = '#e67e22';

        function handleOptionClick(index) {
            if (isAnswered) return;
            isAnswered = true;
            stopTimer();
            
            const question = selectedQuestions[currentQuestionIndex];
            if (!question) {
                showToast('❌ 题目未找到', 3000);
                return;
            }
            
            const isCorrect = index === question.correct;
            const optionBtns = optionsContainer.querySelectorAll('.option-btn');
            
            optionBtns.forEach((btn, i) => {
                btn.classList.add('disabled');
                if (i === question.correct) {
                    btn.classList.add('correct');
                }
                if (i === index && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });
            
            feedbackContainer.style.display = 'block';
            
            if (isCorrect) {
                feedbackContainer.className = 'feedback-container correct';
                feedbackMessage.textContent = '✅ 回答正确！';
                pointsBadge.textContent = '+1 分';
                pointsBadge.className = 'points-badge correct';
                score++;
                playRouletteSound('win');
                setTimeout(() => playRouletteSound('tada'), 300);
            } else {
                feedbackContainer.className = 'feedback-container wrong';
                feedbackMessage.textContent = '❌ 回答错误';
                pointsBadge.textContent = `正确答案：${question.options[question.correct]}`;
                pointsBadge.className = 'points-badge wrong';
                playRouletteSound('lose');
            }
            
            ttsFeedbackBtn.style.display = 'inline-block';
            ttsFeedbackBtn.textContent = '🔊 重新朗读';
            ttsFeedbackBtn.classList.remove('listening');
            
            if (question.explanation) {
                explanationBox.style.display = 'block';
                explanationBox.classList.add('show');
                explanationText.textContent = question.explanation;
                correctAnswerText.textContent = `✅ 正确答案：${question.options[question.correct]}`;
                ttsExplanationBtn.style.display = 'inline-block';
                ttsExplanationBtn.textContent = '🔊 朗读解析';
                ttsExplanationBtn.classList.remove('listening');
            }
            
            const level = LEVELS.find(l => l.id === question._levelId);
            quizHistory.push({
                level: level?.label || question._levelLabel || '?',
                emoji: level?.emoji || question._levelEmoji || '📊',
                correct: isCorrect
            });
            renderHistory();
            updateProgress();
            
            nextBtn.disabled = false;
            
            setTimeout(() => {
                let feedbackTTS = '';
                if (isCorrect) {
                    feedbackTTS = `干得好！正确答案是：${question.options[question.correct]}。`;
                } else {
                    feedbackTTS = `抱歉，这不是正确答案。正确答案是：${question.options[question.correct]}。`;
                }
                const cleanFeedback = cleanTextForTTS(feedbackTTS);
                speakText(cleanFeedback, ttsFeedbackBtn, '🔊 重新朗读');
            }, 300);
        }
        
        function handleTimeout() {

            isAnswered = true;

            stopTTS();
            currentQuestionIndex++;
            
            if (currentQuestionIndex >= 50) {
                showResults();
                return;
            }
            
            questionContainer.style.display = 'none';
            rouletteScreen.style.display = 'block';
            levelResult.style.display = 'none';
            startQuizBtn.style.display = 'none';
            
            spinBtn.disabled = false;
            spinBtn.textContent = '🎯 转动转盘';
            
            updateProgress();
        });
        
        quitBtn.addEventListener('click', () => {
            if (confirm('退出考试？您的进度将丢失。')) {
                stopTimer();
                stopTTS();
                window.location.href = 'xuanze_zhuanke_zh.html';
            }
        });
        
        menuBtn.addEventListener('click', () => {
            stopTTS();
            window.location.href = '../index.html';
        });
        
        dashboardBtn.addEventListener('click', () => {
            stopTTS();
            window.location.href = 'yibiao_zh.html';
        });
        
        retryBtn.addEventListener('click', resetExam);
        backToSpecialtyBtn.addEventListener('click', () => {
            stopTTS();
            window.location.href = `ceshi_zh.html?specialty=${currentSpecialty}`;
        });
        
        // ============================================================
        // TTS 事件
        // ============================================================
        
        ttsQuestionBtn.addEventListener('click', function() {
            const cleanQuestion = cleanTextForTTS(questionText.textContent);
            speakText(cleanQuestion, this, '🔊 朗读题目');
        });
        
        ttsFeedbackBtn.addEventListener('click', function() {
            const question = selectedQuestions[currentQuestionIndex];
            if (!question) return;
            
            let feedbackTTS = '';
            const isCorrect = feedbackContainer.classList.contains('correct');
            if (isCorrect) {
                feedbackTTS = `干得好！正确答案是：${question.options[question.correct]}。`;
            } else {
                feedbackTTS = `抱歉，这不是正确答案。正确答案是：${question.options[question.correct]}。`;
            }
            speakText(cleanTextForTTS(feedbackTTS), this, '🔊 重新朗读');
        });
        
        ttsExplanationBtn.addEventListener('click', function() {
            const question = selectedQuestions[currentQuestionIndex];
            if (!question) return;
            
            const explanationClean = cleanTextForTTS(explanationText.textContent);
            const correctAnswerClean = cleanTextForTTS(`正确答案是：${question.options[question.correct]}`);
            speakText(explanationClean + '。' + correctAnswerClean, this, '🔊 朗读解析');
        });
        
        // ============================================================
        // ✅ 初始化
        // ============================================================
        
        async function init() {
            Logger.info('🎓 证书转盘已加载');
            
            specialtyNameDisplay.textContent = specialtyDisplayName;
            
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    userId = user.uid;
                    const settings = storage.getSettings() || {};
                    userName = settings.user?.fullName || user.displayName || '医生';
                    
                    console.log('✅ 认证考试免费访问');
                    
                    displayIAWelcome();
                    await loadQuestions();
                    roulette = initRoulette();
                    
                    rouletteScreen.style.display = 'block';
                    questionContainer.style.display = 'none';
                    resultContainer.style.display = 'none';
                    
                    updateProgress();
                    
                    console.log('🎓 证书转盘已就绪');
                    console.log(`📚 专科：${currentSpecialty} (${specialtyDisplayName})`);
                    console.log(`📝 已加载 ${selectedQuestions.length} 道题`);
                    console.log('🎯 50 道题 • 30 秒 • 70% 及格');
                    console.log('🤖 个性化 AI 已激活');
                    console.log('💳 支付系统：跳转到 virement_bancaire_zh.html');
                    console.log('📄 支付前证书锁定');
                    console.log('🔇 静音 AI：加载时不自动朗读');
                    
                } else {
                    showLoginRequired();
                }
            });
        }
        
        // ============================================================
        // 需要登录
        // ============================================================
        
        function showLoginRequired() {
            const iaGreeting = document.getElementById('iaGreeting');
            const progressContainer = document.getElementById('progressContainer');
            const rouletteWrapper = document.querySelector('.roulette-wrapper');
            const spinBtn = document.getElementById('spinBtn');
            
            if (iaGreeting) iaGreeting.style.display = 'none';
            if (progressContainer) progressContainer.style.display = 'none';
            if (rouletteWrapper) rouletteWrapper.style.display = 'none';
            if (spinBtn) spinBtn.style.display = 'none';
            
            rouletteScreen.innerHTML = `
                <div style="text-align: center; padding: 40px 20px;">
                    <div style="font-size: 3rem;">🔒</div>
                    <h2 style="color: #2c3e50;">登录以访问考试</h2>
                    <p style="color: #666;">您必须登录才能参加认证考试。</p>
                    <button onclick="window.location.href='zhuce_zh.html'" 
                            style="padding: 14px 40px; background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 30px; font-weight: 700; font-size: 1rem; cursor: pointer; color: white; margin-top: 10px;">
                        🔑 登录
                    </button>
                </div>
            `;
        }
        
        init();
        
    </script>
</body>
</html>
