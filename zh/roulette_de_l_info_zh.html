<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎰 信息转盘 - ETEO</title>
    
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        /* ============================================================
           每日测验专用样式
           ============================================================ */
        
        .roulette-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            margin: 10px auto;
            max-width: 400px;
        }
        
        .roulette-wrapper canvas {
            width: 100%;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 4px 30px rgba(0,0,0,0.12);
            display: block;
        }
        
        .roulette-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            filter: drop-shadow(0 0 8px #ff6b00) drop-shadow(0 0 20px #ff6b00);
            animation: pointerPulse 1.5s ease-in-out infinite;
            pointer-events: none;
        }
        
        .roulette-pointer svg {
            width: 30px;
            height: 36px;
            display: block;
        }
        
        @keyframes pointerPulse {
            0% { filter: drop-shadow(0 0 8px #ff6b00) drop-shadow(0 0 20px #ff6b00); }
            50% { filter: drop-shadow(0 0 15px #ff6b00) drop-shadow(0 0 35px #ff6b00) drop-shadow(0 0 60px rgba(255,107,0,0.3)); }
            100% { filter: drop-shadow(0 0 8px #ff6b00) drop-shadow(0 0 20px #ff6b00); }
        }
        
        #levelRouletteContainer {
            display: none;
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255,255,255,0.5);
            border-radius: 20px;
            border: 1px solid rgba(155,89,182,0.2);
        }
        
        #levelRouletteContainer .roulette-wrapper {
            max-width: 280px;
        }
        
        #levelRouletteContainer .roulette-pointer {
            top: -8px;
        }
        
        #levelRouletteContainer .roulette-pointer svg {
            width: 24px;
            height: 30px;
        }
        
        .roulette-result {
            display: none;
            font-size: 1rem;
            font-weight: 600;
            color: #2c3e50;
            padding: 10px 16px;
            background: #f0f4ff;
            border-radius: 14px;
            border-left: 4px solid #667eea;
            margin: 8px auto;
            max-width: 400px;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            text-align: center;
        }
        
        .roulette-result .highlight {
            color: #667eea;
            font-weight: 800;
        }
        
        .roulette-spin-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #f57c00, #e65100);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(245, 124, 0, 0.3);
            margin: 5px 0;
        }
        
        .roulette-spin-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(245, 124, 0, 0.4);
        }
        
        .roulette-spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            background: #b0b0b0;
            box-shadow: none;
        }
        
        .roulette-replay-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.25);
        }
        
        .roulette-replay-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.35);
        }
        
        .roulette-replay-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .ia-greeting {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 15px;
            color: white;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            text-align: left;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.25);
        }
        
        .ia-avatar {
            font-size: 2.5rem;
            flex-shrink: 0;
            animation: iaPulse 2s ease-in-out infinite;
        }
        
        @keyframes iaPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .ia-message {
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0;
        }
        
        .ia-message strong {
            color: #ffd700;
        }
        
        @keyframes iaPulseResult {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.05) rotate(-5deg); }
            75% { transform: scale(1.05) rotate(5deg); }
        }
        
        .ia-result-avatar {
            animation: iaPulseResult 2s ease-in-out infinite;
        }
        
        .btn-share {
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #1da1f2, #0d8bd9);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }
        
        .btn-share:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(29, 161, 242, 0.4);
        }
        
        .roulette-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 10px 0;
        }
        
        .roulette-stat-item {
            background: white;
            border-radius: 12px;
            padding: 12px 10px;
            text-align: center;
            border: 1px solid #e8e8e8;
        }
        
        .roulette-stat-item .number {
            font-size: 1.5rem;
            font-weight: 800;
            color: #2c3e50;
        }
        
        .roulette-stat-item .label {
            font-size: 0.7rem;
            color: #888;
            display: block;
            margin-top: 4px;
        }
        
        .roulette-section {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            padding: 16px;
            margin-top: 16px;
            border: 1px solid rgba(255, 152, 0, 0.2);
        }
        
        .roulette-section h3 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        
        /* ============================================================
           弹窗样式（明天再来）
           ============================================================ */
        
        .payment-lock-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        
        .payment-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .payment-popup {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            animation: popupIn 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        @keyframes popupIn {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        
        .payment-popup h2 {
            color: #2c3e50;
            margin: 10px 0;
        }
        
        .payment-popup p {
            color: #666;
            margin: 10px 0;
            line-height: 1.6;
        }
        
        .payment-popup .features {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
            margin: 15px 0;
            text-align: left;
        }
        
        .payment-popup .features p {
            margin: 4px 0;
            font-size: 0.9rem;
            color: #333;
        }
        
        .payment-popup .pay-btn {
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            color: white;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .payment-popup .pay-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }
        
        .payment-popup .pay-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .payment-popup .close-btn {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 10px;
            width: 100%;
            transition: color 0.3s ease;
        }
        
        .payment-popup .close-btn:hover {
            color: #333;
        }
        
        .payment-popup .secure-text {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 10px;
        }
        
        .payment-popup .info-box {
            border-radius: 12px;
            padding: 15px;
            margin: 10px 0;
            text-align: left;
        }
        
        .payment-popup .info-box.success {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
        }
        
        .payment-popup .info-box.success p {
            color: #2e7d32;
        }
        
        .payment-popup .info-box.warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
        }
        
        .payment-popup .info-box.warning p {
            color: #856404;
        }
        
        /* ✅ 配额徽章 */
        .quota-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
            margin: 5px 0;
            background: #e8f5e9;
            color: #2e7d32;
            border: 2px solid #4caf50;
        }
        
        .quota-badge.warning {
            background: #fff3cd;
            color: #856404;
            border-color: #ffc107;
        }
        
        .quota-badge.danger {
            background: #ffebee;
            color: #c62828;
            border-color: #e74c3c;
            animation: pulseBadge 1.5s ease-in-out infinite;
        }
        
        @keyframes pulseBadge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @media (max-width: 520px) {
            .ia-greeting {
                padding: 12px 14px;
                gap: 10px;
            }
            .ia-avatar {
                font-size: 2rem;
            }
            .ia-message {
                font-size: 0.85rem;
            }
            .roulette-pointer {
                top: -6px;
            }
            .roulette-pointer svg {
                width: 24px;
                height: 30px;
            }
            #levelRouletteContainer .roulette-pointer {
                top: -5px;
            }
            #levelRouletteContainer .roulette-pointer svg {
                width: 20px;
                height: 26px;
            }
            .roulette-spin-btn {
                font-size: 0.85rem;
                padding: 10px 20px;
            }
            .roulette-result {
                font-size: 0.85rem;
                padding: 8px 12px;
            }
            .btn-share {
                font-size: 0.85rem;
                padding: 10px 20px;
            }
            .roulette-stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .payment-popup {
                padding: 20px;
            }
        }
        
        @media (max-width: 400px) {
            .ia-avatar {
                font-size: 1.6rem;
            }
            .ia-message {
                font-size: 0.78rem;
            }
            .roulette-pointer {
                top: -4px;
            }
            .roulette-pointer svg {
                width: 20px;
                height: 26px;
            }
            .payment-popup {
                padding: 15px;
            }
        }
    </style>

    <div class="container quiz-container">
        
        <!-- ============================================================ -->
        <!-- 导航 -->
        <!-- ============================================================ -->
        <div class="nav-top">

        <!-- ============================================================ -->

        <div id="rouletteScreen">

                <h1 style="font-size: 1.6rem; margin: 0; color: #2c3e50;">🎰 信息转盘</h1>

        // ============================================================
        // 为 TTS 清理文本
        // ============================================================
        
        function cleanTextForTTS(text) {
            if (!text) return '';
            let cleaned = text.replace(/[\u{1F000}-\u{1FFFF}]/gu, '');
            cleaned = cleaned.replace(/[⭐🌟🔥💎🎯🎉💪🧠📚📖🔊✅❌⏰🎰🦷🔪✨🔩👄👶💉🖨️📸📷🧼🔧🏥📊📋💰🏛️📈💻🛡️🌍👩‍⚕️📜🤝⚖️🎓📇👴🧪🎡👆]/g, '');
            cleaned = cleaned.replace(/[""]/g, '"');
            cleaned = cleaned.replace(/['']/g, "'");
            cleaned = cleaned.replace(/\s+/g, ' ').trim();
            return cleaned;
        }

            document.querySelectorAll('.tts-btn.listening, .listen-btn.listening, .listen-synopsis-btn.listening, .listen-chapter-btn.listening').forEach(btn => {

        // ============================================================
        // TTS
        // ============================================================
        
        function speakText(text, button, buttonText = '🔊') {
            if (!window.tts || typeof window.tts.speak !== 'function') {
                console.warn('⚠️ TTS 不可用');
                if (button) {
                    button.textContent = buttonText;
                    button.classList.remove('listening');
                }
                return;
            }
            const cleanText = cleanTextForTTS(text);
            if (!cleanText || cleanText.trim() === '') {
                console.warn('⚠️ 清理后 TTS 文本为空');
                if (button) {
                    button.textContent = buttonText;
                    button.classList.remove('listening');
                }
                return;
            }
            let wasSpeaking = false;
            try {
                if (window.tts.isSpeakingNow && window.tts.isSpeakingNow()) {
                    wasSpeaking = true;
                    window.tts.stop();
                }
            } catch (e) {}
            document.querySelectorAll('.tts-btn.listening, .listen-btn.listening, .listen-synopsis-btn.listening, .listen-chapter-btn.listening').forEach(btn => {
                const originalText = btn.dataset.originalText || '🔊';
                btn.textContent = originalText;
                btn.classList.remove('listening');
            });
            if (button) {
                button.dataset.originalText = buttonText;
                button.textContent = '⏹️ 停止';
                button.classList.add('listening');
            }
            const startSpeaking = () => {
                try {
                    window.tts.speak(
                        cleanText,
                        'zh',
                        0.9,
                        1.0,
                        () => {
                            if (button) {
                                button.textContent = buttonText;
                                button.classList.remove('listening');
                            }
                        },
                        (error) => {
                            if (button) {
                                button.textContent = buttonText;
                                button.classList.remove('listening');
                            }
                        }
                    );
                } catch (e) {
                    if (button) {
                        button.textContent = buttonText;
                        button.classList.remove('listening');
                    }
                }
            };
            if (wasSpeaking) {
                setTimeout(startSpeaking, 200);
            } else {
                startSpeaking();
            }
        }
        
        // ============================================================
        // 音效
        // ============================================================
        
        function playRouletteSound(type, totalDuration) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                if (type === 'spin') {
                    if (!totalDuration) totalDuration = 4000;
                    const minTicks = 15;
                    const maxTicks = 35;
                    const totalTicks = Math.min(maxTicks, Math.max(minTicks, Math.floor(totalDuration / 130)));
                    let count = 0;
                    const baseFreq = 523;
                    const volume = 0.15;
                    
                    function playTick() {
                        if (count >= totalTicks) return;
                        const progress = count / totalTicks;
                        const speedFactor = 0.4 + 0.6 * (1 - Math.sin(progress * Math.PI));
                        const tickDelay = (totalDuration / totalTicks) * speedFactor * 0.9;
                        
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        const freqVariation = Math.sin(progress * Math.PI) * 200;
                        osc.frequency.value = baseFreq + freqVariation;
                        osc.type = 'square';
                        gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                        gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.01);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.05);
                        
                        count++;
                        if (count < totalTicks) {
                            setTimeout(playTick, tickDelay);
                        }
                    }
                    setTimeout(playTick, 50);
                    
                } else if (type === 'win') {
                    const notes = [392, 523, 659, 784, 1047];
                    const volume = 0.25;
                    const duration = 0.35;
                    const delay = 140;
                    notes.forEach((freq, i) => {
                        setTimeout(() => {
                            const osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            osc.frequency.value = freq;
                            osc.type = 'square';
                            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                            gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.04);
                            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                            osc.start();
                            osc.stop(audioCtx.currentTime + duration);
                        }, i * delay);
                    });
                    
                } else if (type === 'lose') {
                    const notes = [523, 494, 466, 440];
                    const volume = 0.25;
                    const duration = 0.4;
                    const delay = 140;
                    notes.forEach((freq, i) => {
                        setTimeout(() => {
                            const osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            osc.frequency.value = freq;
                            osc.type = 'square';
                            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                            gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.04);
                            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                            osc.start();
                            osc.stop(audioCtx.currentTime + duration);
                        }, i * delay);
                    });
                    
                } else if (type === 'click') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.value = 1200;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.20, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                    
                } else if (type === 'tada') {
                    const notesTada = [523, 659, 784, 1047, 1318];
                    notesTada.forEach((freq, i) => {
                        setTimeout(() => {
                            const osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            osc.frequency.value = freq;
                            osc.type = 'square';
                            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                            osc.start();
                            osc.stop(audioCtx.currentTime + 0.12);
                        }, i * 100);
                    });
                }
            } catch (e) {}
        }

        let roulette = null;

        function initRoulette() {
            const canvas = document.getElementById('rouletteCanvas');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) / 2 - 15;
            const segmentAngle = (2 * Math.PI) / SPECIALTIES.length;
            let currentAngle = 0;
            let animationId = null;
            const colors = ['#e94560', '#533483', '#0f3460', '#16213e', 
                           '#e94560', '#533483', '#0f3460', '#16213e',
                           '#e94560', '#533483', '#0f3460', '#16213e',
                           '#e94560', '#533483', '#0f3460', '#16213e',
                           '#e94560', '#533483', '#0f3460', '#16213e',
                           '#e94560', '#533483', '#0f3460', '#16213e',
                           '#e94560', '#533483', '#0f3460', '#16213e',
                           '#e94560', '#533483', '#0f3460', '#16213e',
                           '#e94560', '#533483', '#0f3460', '#16213e'];
            
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < SPECIALTIES.length; i++) {
                    const startAngle = currentAngle + i * segmentAngle;
                    const endAngle = startAngle + segmentAngle;
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                    ctx.closePath();
                    ctx.fillStyle = colors[i % colors.length];
                    ctx.fill();
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(startAngle + segmentAngle / 2);
                    ctx.textAlign = 'right';
                    ctx.fillStyle = 'white';
                    ctx.font = '10px Arial';
                    const text = SPECIALTIES[i].emoji + ' ' + SPECIALTIES[i].name;
                    let displayText = text;
                    if (ctx.measureText(text).width > radius - 20) {
                        displayText = SPECIALTIES[i].name.substring(0, 10) + '…';
                    }
                    ctx.fillText(displayText, radius - 10, 4);
                    ctx.restore();
                }
                ctx.beginPath();
                ctx.arc(centerX, centerY, 22, 0, 2 * Math.PI);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#333';
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🎯', centerX, centerY);
            }
            
            function spin(callback) {
                if (isSpinning) return;
                isSpinning = true;
                spinBtn.disabled = true;
                spinBtn.textContent = '⏳ 进行中...';
                
                const extraSpins = 4 + Math.random() * 4;
                const targetAngle = currentAngle + extraSpins * 2 * Math.PI + Math.random() * 2 * Math.PI;
                const duration = 3500 + Math.random() * 1500;
                const startTime = Date.now();
                const startAngle = currentAngle;
                
                playRouletteSound('spin', duration);
                
                function animate() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    currentAngle = startAngle + (targetAngle - startAngle) * easeOut;
                    draw();
                    
                    if (progress < 1) {
                        animationId = requestAnimationFrame(animate);
                    } else {
                        currentAngle = targetAngle;
                        draw();
                        isSpinning = false;
                        spinBtn.disabled = true;
                        spinBtn.textContent = '🎯 转动专科转盘';
                        
                        const normalizedAngle = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
                        const pointerAngle = 3 * Math.PI / 2;
                        const resultAngle = (pointerAngle - normalizedAngle + 2 * Math.PI) % (2 * Math.PI);
                        const index = Math.floor(resultAngle / segmentAngle) % SPECIALTIES.length;
                        
                        const segment = SPECIALTIES[index];
                        currentSpecialty = segment.id;
                        selectedSpecialtyDisplay.textContent = `${segment.emoji} ${segment.name}`;
                        specialtyResult.style.display = 'flex';
                        playRouletteSound('click');
                        if (callback) callback();
                    }
                }
                animate();
            }
            draw();
            return { spin, draw, isSpinning: () => isSpinning };
        }
        
        // ============================================================
        // 转盘 2 : 6 个等级
        // ============================================================
        
        let levelRoulette = null;
        let isLevelSpinning = false;
        
        function initLevelRoulette() {
            const canvas = document.getElementById('levelRouletteCanvas');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) / 2 - 15;
            const segmentAngle = (2 * Math.PI) / LEVELS.length;
            let currentAngle = 0;
            let animationId = null;
            const colors = ['#4caf50', '#8bc34a', '#ff9800', '#f57c00', '#e74c3c', '#9b59b6'];
            
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < LEVELS.length; i++) {
                    const startAngle = currentAngle + i * segmentAngle;
                    const endAngle = startAngle + segmentAngle;
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                    ctx.closePath();
                    ctx.fillStyle = colors[i % colors.length];
                    ctx.fill();
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(startAngle + segmentAngle / 2);
                    ctx.textAlign = 'right';
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 11px Arial';
                    ctx.fillText(LEVELS[i].emoji + ' ' + LEVELS[i].label, radius - 8, 4);
                    ctx.restore();
                }
                ctx.beginPath();
                ctx.arc(centerX, centerY, 18, 0, 2 * Math.PI);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#333';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🎯', centerX, centerY);
            }
            
            function spin(callback) {
                if (isLevelSpinning) return;
                isLevelSpinning = true;
                spinLevelBtn.disabled = true;
                spinLevelBtn.textContent = '⏳ 进行中...';
                
                const extraSpins = 2 + Math.random() * 3;
                const targetAngle = currentAngle + extraSpins * 2 * Math.PI + Math.random() * 2 * Math.PI;
                const duration = 3500 + Math.random() * 1500;
                const startTime = Date.now();
                const startAngle = currentAngle;
                
                playRouletteSound('spin', duration);
                
                function animate() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    currentAngle = startAngle + (targetAngle - startAngle) * easeOut;
                    draw();
                    if (progress < 1) {
                        animationId = requestAnimationFrame(animate);
                    } else {
                        currentAngle = targetAngle;
                        draw();
                        isLevelSpinning = false;
                        spinLevelBtn.disabled = true;
                        spinLevelBtn.textContent = '🎯 转动等级';
                        
                        const normalizedAngle = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
                        const pointerAngle = 3 * Math.PI / 2;
                        const resultAngle = (pointerAngle - normalizedAngle + 2 * Math.PI) % (2 * Math.PI);
                        const index = Math.floor(resultAngle / segmentAngle) % LEVELS.length;
                        currentLevel = LEVELS[index].id;
                        selectedLevelDisplay.textContent = LEVELS[index].label;
                        levelResult.style.display = 'flex';
                        playRouletteSound('click');
                        if (callback) callback();
                    }
                }
                animate();
            }
            draw();
            return { spin, draw, isSpinning: () => isLevelSpinning };
        }

        async function loadQuestionForLevel(specialtyId, levelId) {
            try {
                const path = `../data/zh/${specialtyId}/${levelId}.json`;
                const response = await fetch(path);
                if (!response.ok) {
                    throw new Error('文件未找到');
                }
                const data = await response.json();
                const questions = data.questions || [];
                if (questions.length === 0) {
                    throw new Error('没有题目');
                }
                currentQuestions = questions;
                const randomIndex = Math.floor(Math.random() * questions.length);
                currentQuestion = questions[randomIndex];
            } catch (error) {
                console.error('❌ 加载时出错：', error);
                showToast('❌ 加载题目时出错', 3000);
            }
        }

        function displayQuestion(question) {
            isAnswered = false;
            timeRemaining = 40;
            const specialty = SPECIALTIES.find(s => s.id === currentSpecialty);
            const levelLabel = LEVELS.find(l => l.id === currentLevel)?.label || currentLevel;
            quizTitle.textContent = `🎰 ${specialty?.emoji || ''} ${specialty?.name || ''} - ${levelLabel}`;
            questionText.textContent = question.question || '题目不可用';
            optionsContainer.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            if (question.options && question.options.length > 0) {
                question.options.forEach((option, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<span class="letter">${letters[i]}</span> ${option}`;
                    btn.dataset.index = i;
                    btn.addEventListener('click', () => handleOptionClick(i));
                    optionsContainer.appendChild(btn);
                });
            }
            feedbackContainer.style.display = 'none';
            feedbackContainer.className = 'feedback-container';
            explanationBox.style.display = 'none';
            explanationBox.classList.remove('show');
            ttsFeedbackBtn.style.display = 'none';
            ttsExplanationBtn.style.display = 'none';
            nextBtn.disabled = true;
            timerBottomValue.textContent = timeRemaining;
            timerBottom.style.color = '#e67e22';
            startTimer();
            setTimeout(() => {
                const cleanQuestion = cleanTextForTTS(question.question);
                speakText(cleanQuestion, ttsQuestionBtn, '🔊 朗读题目');
            }, 500);
        }
        
        // ============================================================
        // 计时器
        // ============================================================
        
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                timerBottomValue.textContent = timeRemaining;
                if (timeRemaining <= 5) {
                    timerBottom.style.color = '#e74c3c';
                }
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }
        
        function stopTimer() {
            clearInterval(timerInterval);
            timerBottom.style.color = '#e67e22';
        }
        
        // ============================================================
        // 处理点击
        // ============================================================
        
        function handleOptionClick(index) {
            if (isAnswered) return;
            isAnswered = true;
            stopTimer();
            const isCorrect = index === currentQuestion.correct;
            const optionBtns = optionsContainer.querySelectorAll('.option-btn');
            optionBtns.forEach((btn, i) => {
                btn.classList.add('disabled');
                if (i === currentQuestion.correct) {
                    btn.classList.add('correct');
                }
                if (i === index && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });
            feedbackContainer.style.display = 'block';
            if (isCorrect) {
                feedbackContainer.className = 'feedback-container correct';
                feedbackMessage.textContent = '✅ 回答正确！';
                pointsBadge.textContent = '+1 分';
                pointsBadge.className = 'points-badge correct';
                playRouletteSound('win');
                setTimeout(() => playRouletteSound('tada'), 300);
            } else {
                feedbackContainer.className = 'feedback-container wrong';
                feedbackMessage.textContent = '❌ 回答错误';
                pointsBadge.textContent = `正确答案：${currentQuestion.options[currentQuestion.correct]}`;
                pointsBadge.className = 'points-badge wrong';
                playRouletteSound('lose');
            }
            ttsFeedbackBtn.style.display = 'inline-block';
            ttsFeedbackBtn.textContent = '🔊 重新朗读';
            ttsFeedbackBtn.classList.remove('listening');
            if (currentQuestion.explanation) {
                explanationBox.style.display = 'block';
                explanationBox.classList.add('show');
                explanationText.textContent = currentQuestion.explanation;
                correctAnswerText.textContent = `✅ 正确答案：${currentQuestion.options[currentQuestion.correct]}`;
                ttsExplanationBtn.style.display = 'inline-block';
                ttsExplanationBtn.textContent = '🔊 朗读解析';
                ttsExplanationBtn.classList.remove('listening');
            }
            const specialty = SPECIALTIES.find(s => s.id === currentSpecialty);
            subscription.recordResult(
                specialty?.name || currentSpecialty,
                currentLevel,
                currentQuestion.id,
                isCorrect,
                30 - timeRemaining
            );
            nextBtn.disabled = false;
            setTimeout(() => {
                let feedbackTTS = '';
                if (isCorrect) {
                    feedbackTTS = `干得好！正确答案是：${currentQuestion.options[currentQuestion.correct]}。`;
                } else {
                    feedbackTTS = `抱歉，这不是正确答案。正确答案是：${currentQuestion.options[currentQuestion.correct]}。`;
                }
                const cleanFeedback = cleanTextForTTS(feedbackTTS);
                speakText(cleanFeedback, ttsFeedbackBtn, '🔊 重新朗读');
            }, 300);
        }
        
        // ============================================================
        // 超时
        // ============================================================
        
        function handleTimeout() {
            if (isAnswered) return;
            isAnswered = true;
            const optionBtns = optionsContainer.querySelectorAll('.option-btn');
            optionBtns.forEach((btn, i) => {
                btn.classList.add('disabled');

            feedbackContainer.style.display = 'block';

                const randomIndex = Math.floor(Math.random() * wrongMessages.length);

                ttsMessageText = wrongMessages[randomIndex].tts;
                resultTitle.textContent = '💪 别担心！';
                resultMessage.textContent = `正确答案是：${currentQuestion.options[currentQuestion.correct]}。📖`;
                if (!unlockedBadges.length) {
                    badgeContainer.innerHTML = `<div style="background: #ff9800; color: white; padding: 10px 30px; border-radius: 30px; font-weight: 700;">📚 继续学习</div>`;
                }
                playRouletteSound('lose');
            }
            
            if (iaResultContainer) {
                iaResultContainer.innerHTML = `
                    <div style="background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 16px; padding: 14px 18px; margin: 12px 0; color: white; display: flex; align-items: flex-start; gap: 12px; text-align: left; box-shadow: 0 4px 20px rgba(102, 126, 234, 0.25);">
                        <div style="font-size: 2rem; flex-shrink: 0;" class="ia-result-avatar">🤖</div>
                        <p style="margin: 0; font-size: 0.9rem; line-height: 1.6;">${iaMessageText}</p>
                    </div>
                    ${rewardsHTML}
                `;
            }
            
            const resultButtons = document.querySelector('.result-buttons');
            if (resultButtons) {
                const oldShareBtn = document.getElementById('shareResultBtn');
                if (oldShareBtn) {
                    oldShareBtn.remove();
                }
                
                const shareBtn = document.createElement('button');
                shareBtn.className = 'btn-share';
                shareBtn.id = 'shareResultBtn';
                shareBtn.textContent = '📤 分享到社交媒体';
                shareBtn.addEventListener('click', shareQuizResult);
                resultButtons.insertBefore(shareBtn, resultButtons.firstChild);
            }
            
            setTimeout(() => {
                const cleanMessage = cleanTextForTTS(ttsMessageText);
                speakText(cleanMessage, null);
            }, 1200);
        }
        
        // ============================================================
        // 事件
        // ============================================================
        
        spinBtn.addEventListener('click', () => {
            if (roulette && !roulette.isSpinning()) {
                stopTTS();
                levelRouletteContainer.style.display = 'none';
                spinLevelBtn.style.display = 'none';
                levelResult.style.display = 'none';
                startQuizBtn.style.display = 'none';
                specialtyResult.style.display = 'none';
                roulette.spin(() => {
                    setTimeout(() => {
                        showLevelRoulette();
                    }, 400);
                });
            }
        });
        
        spinLevelBtn.addEventListener('click', () => {
            if (levelRoulette && !levelRoulette.isSpinning()) {
                stopTTS();
                levelResult.style.display = 'none';
                startQuizBtn.style.display = 'none';
                levelRoulette.spin(() => {
                    const specialty = SPECIALTIES.find(s => s.id === currentSpecialty);
                    quizHistory.push({
                        specialty: specialty?.name || currentSpecialty,
                        level: LEVELS.find(l => l.id === currentLevel)?.label || currentLevel,
                        emoji: specialty?.emoji || '🦷'
                    });
                    renderHistory();
                    startQuizBtn.style.display = 'inline-block';
                    const msg = `专科 ${specialty?.name || ''} 等级 ${LEVELS.find(l => l.id === currentLevel)?.label || ''}`;
                    const cleanMsg = cleanTextForTTS(msg);
                    setTimeout(() => speakText(cleanMsg, null), 500);
                    loadQuestionForLevel(currentSpecialty, currentLevel);
                });
            }
        });
        
        startQuizBtn.addEventListener('click', startQuiz);
        nextBtn.addEventListener('click', showResults);
        
        quitBtn.addEventListener('click', () => {
            if (confirm('退出测验？')) {
                stopTimer();
                stopTTS();
                window.location.href = 'xuanze_zhuanke_zh.html';
            }
        });
        
        anotherQuizBtn.addEventListener('click', () => {
            stopTTS();
            resultContainer.style.display = 'none';
            rouletteScreen.style.display = 'block';
            levelRouletteContainer.style.display = 'none';
            levelResult.style.display = 'none';
            startQuizBtn.style.display = 'none';
            specialtyResult.style.display = 'none';
            spinLevelBtn.style.display = 'none';
            spinBtn.disabled = false;
            spinBtn.textContent = '🎯 转动专科转盘';
            if (roulette) {
                roulette.draw();
            }
            
            loadUserData().then(() => {
                updateQuotaDisplay();
                displayIAWelcome();
            });
        });
        
        chooseSpecialtyBtn.addEventListener('click', () => {
            stopTTS();
            window.location.href = 'xuanze_zhuanke_zh.html';
        });
        
        menuBtn.addEventListener('click', () => {
            stopTTS();
            window.location.href = '../index.html';
        });
        
        document.querySelectorAll('.back-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                stopTTS();
            });
        });
        
        ttsQuestionBtn.addEventListener('click', function() {
            const cleanQuestion = cleanTextForTTS(questionText.textContent);
            speakText(cleanQuestion, this, '🔊 朗读题目');
        });
        
        ttsFeedbackBtn.addEventListener('click', function() {
            let feedbackTTS = '';
            const isCorrect = feedbackContainer.classList.contains('correct');
            if (isCorrect) {
                feedbackTTS = `干得好！正确答案是：${currentQuestion.options[currentQuestion.correct]}。`;
            } else {
                feedbackTTS = `抱歉，这不是正确答案。正确答案是：${currentQuestion.options[currentQuestion.correct]}。`;
            }
            const cleanFeedback = cleanTextForTTS(feedbackTTS);
            speakText(cleanFeedback, this, '🔊 重新朗读');
        });
        
        ttsExplanationBtn.addEventListener('click', function() {
            const explanationClean = cleanTextForTTS(explanationText.textContent);
            const correctAnswerClean = cleanTextForTTS(`正确答案是：${currentQuestion.options[currentQuestion.correct]}`);
            const fullText = explanationClean + '。' + correctAnswerClean;
            speakText(fullText, this, '🔊 朗读解析');
        });
        
        // ============================================================
        // ✅ 初始化
        // ============================================================
        
        async function init() {
            Logger.info('🎰 信息转盘已加载 - 每天 10 次免费（中文）');
            
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    console.log('👤 用户已连接：', user.email);
                    
                    await loadUserData();
                    updateQuotaDisplay();
                    
                    roulette = initRoulette();
                    levelRoulette = initLevelRoulette();
                    rouletteScreen.style.display = 'block';
                    questionContainer.style.display = 'none';
                    resultContainer.style.display = 'none';
                    resetButtons();
                    
                    displayIAWelcome();
                    
                    console.log('🎰 信息转盘已就绪！');
                    console.log(`🎯 每天 ${MAX_DAILY_QUIZZES} 次免费测验`);
                    console.log(`📊 今天测验数：${dailyQuizzesCount}/${MAX_DAILY_QUIZZES}`);
                    console.log(`📈 历史总数：${totalQuizzesAllTime}`);
                    console.log('✅ 100% 免费 - 无需付款');
                    console.log('🌙 午夜自动重置');
                    console.log('🔇 SILENCIO IA : pas de lecture auto au chargement');
                    
                } else {
                    console.log('👤 用户未登录，跳转到注册页');
                    window.location.href = 'zhuce_zh.html';
                }
            });
        }
        
        init();
        
    </script>
</body>
</html>
