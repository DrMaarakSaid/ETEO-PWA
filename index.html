        // ============================================================

        const listenBtn = document.getElementById('listenBtn');

        const listenBtnText = document.getElementById('listenBtnText');
        const validateBtnText = document.getElementById('validateBtnText');
        const dashboardBtnText = document.getElementById('dashboardBtnText');
        const toast = document.getElementById('toast');
        const dashboardBtn = document.getElementById('dashboardBtn');
        
        // Nouveaux éléments pour la traduction complète
        const subtitleText = document.getElementById('subtitleText');
        const betaText = document.getElementById('betaText');
        const langBtnFr = document.getElementById('langBtnFr');
        const langBtnEn = document.getElementById('langBtnEn');
        const langBtnEs = document.getElementById('langBtnEs');
        const langBtnDe = document.getElementById('langBtnDe');
        const langBtnRu = document.getElementById('langBtnRu');
        const langBtnIt = document.getElementById('langBtnIt');
        const langBtnZh = document.getElementById('langBtnZh');
        const footerLine1 = document.getElementById('footerLine1');
        const footerLine2 = document.getElementById('footerLine2');
        const footerLine3 = document.getElementById('footerLine3');
        
        // ============================================================
        // UTILITAIRES
        // ============================================================
        
        function showToast(message, duration = 2500) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }
        
        function getLangFromButton(btn) {
            return btn.dataset.lang;
        }
        
        // ============================================================
        // ⭐ FONCTION UNIVERSELLE POUR METTRE À JOUR TOUS LES TEXTES
        // ============================================================
        
        function updateAllTexts(lang) {
            const config = LANG_CONFIG[lang];
            if (!config) return;
            
            const ui = config.ui;
            
            // Mise à jour de tous les éléments textuels
            if (subtitleText) subtitleText.textContent = ui.subtitle;
            if (betaText) betaText.textContent = ui.betaText;
            if (langBtnFr) langBtnFr.textContent = ui.langBtnFr;
            if (langBtnEn) langBtnEn.textContent = ui.langBtnEn;
            if (langBtnEs) langBtnEs.textContent = ui.langBtnEs;
            if (langBtnDe) langBtnDe.textContent = ui.langBtnDe;
            if (langBtnRu) langBtnRu.textContent = ui.langBtnRu;
            if (langBtnIt) langBtnIt.textContent = ui.langBtnIt;
            if (langBtnZh) langBtnZh.textContent = ui.langBtnZh;
            if (listenBtnText) listenBtnText.textContent = ui.listenBtn;
            if (validateBtnText) validateBtnText.textContent = ui.validateBtn;
            if (dashboardBtnText) dashboardBtnText.textContent = ui.dashboardBtn;
            if (footerLine1) footerLine1.textContent = ui.footerLine1;
            if (footerLine2) footerLine2.textContent = ui.footerLine2;
            if (footerLine3) footerLine3.textContent = ui.footerLine3;
            
            // ✅ Mise à jour du titre + attribut lang de la page
            document.title = `ETEO - ${ui.subtitle}`;
            document.documentElement.lang = lang;
            
            Logger.info(`🔄 All interface texts updated for language: ${lang}`);
        }
        
        // ============================================================
        // GESTION DES LANGUES
        // ============================================================
        
        langBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const lang = getLangFromButton(btn);
                selectLanguage(lang);
            });
        });
        
        function selectLanguage(lang) {
            // Mise à jour de l'état visuel des boutons
            langBtns.forEach(b => b.classList.remove('active'));
            
            const selectedBtn = document.querySelector(`.lang-btn[data-lang="${lang}"]`);
            if (selectedBtn) {
                selectedBtn.classList.add('active');
            }
            
            selectedLang = lang;
            
            // ✅ Activation de TOUS les boutons d'action (y compris Dashboard)
            validateBtn.disabled = false;
            listenBtn.disabled = false;
            dashboardBtn.disabled = false;
            
            // ⭐ Mise à jour de TOUS les textes de l'interface
            updateAllTexts(lang);
            
            // ✅ Mise à jour du dashboardBtn pour la redirection
            const config = LANG_CONFIG[lang];
            if (config && dashboardBtn) {
                dashboardBtn.onclick = function() {
                    window.location.href = config.dashboardPage;
                };
            }
            
            // Gestion du TTS
            if (config && listenBtn) {
                if (window.tts && window.tts.isSpeakingNow()) {
                    window.tts.stop();
                }
                listenBtn.classList.remove('listening');
                listenBtn.innerHTML = `🔊 <span id="listenBtnText">${config.ui.listenBtn}</span>`;
                listenBtn.disabled = false;
            }
            
            // Sauvegarde dans localStorage
            const settings = storage.getSettings() || {};
            settings.language = lang;
            storage.saveSettings(settings);
            
            // Mise à jour du service de traduction
            translate.currentLang = lang;
            
            Logger.info(`Language selected: ${lang}`);
            showToast(`🌐 Language selected: ${config.label}`, 2000);
        }
        
        // ============================================================
        // BOUTON ÉCOUTER
        // ============================================================
        
        listenBtn.addEventListener('click', function(event) {
            event.preventDefault();
            event.stopPropagation();
            
            if (!window.tts) {
                showToast('❌ TTS Module not available', 3000);
                return;
            }
            
            if (window.tts.isSpeakingNow()) {
                window.tts.stop();
                const config = LANG_CONFIG[selectedLang || 'en'];
                this.innerHTML = `🔊 <span id="listenBtnText">${config.ui.listenBtn}</span>`;
                this.classList.remove('listening');
                this.disabled = false;
                return;
            }
            
            const lang = selectedLang || 'en';
            const config = LANG_CONFIG[lang];
            
            if (!config) {
                showToast('❌ Language not supported', 3000);
                return;
            }
            
            this.innerHTML = `⏹️ <span id="listenBtnText">${config.ui.listenBtn}</span>`;
            this.classList.add('listening');
            this.disabled = false;
            
            window.tts.speak(
                config.welcomeMessage,
                lang,
                0.9,
                1.0,
                () => {
                    const currentConfig = LANG_CONFIG[selectedLang || 'en'];
                    this.innerHTML = `🔊 <span id="listenBtnText">${currentConfig.ui.listenBtn}</span>`;
                    this.classList.remove('listening');
                    this.disabled = false;
                    showToast(currentConfig.ui.toastMessage, 2000);
                },
                (error) => {
                    console.error('❌ TTS Error:', error);
                    const currentConfig = LANG_CONFIG[selectedLang || 'en'];
                    this.innerHTML = `🔊 <span id="listenBtnText">${currentConfig.ui.listenBtn}</span>`;
                    this.classList.remove('listening');
                    this.disabled = false;
                    showToast('❌ Voice reading error', 3000);
                }
            );
        });
        
        // ============================================================
        // BOUTON VALIDER
        // ============================================================
        
        validateBtn.addEventListener('click', () => {
            if (!selectedLang) {
                showToast('⚠️ Please select a language first', 2500);
                return;
            }
            
            const config = LANG_CONFIG[selectedLang];
            if (!config) {
                showToast('❌ Language not supported', 3000);
                return;
            }
            
            const settings = storage.getSettings() || {};
            settings.language = selectedLang;
            storage.saveSettings(settings);
            
            showToast(`⏳ Redirecting to ${config.label}...`, 2000);
            
            validateBtn.disabled = true;
            langBtns.forEach(b => b.style.opacity = '0.5');
            
            setTimeout(() => {
                window.location.href = config.page;
            }, 1500);
        });
        
        // ============================================================
        // INITIALISATION
        // ============================================================
        
        // Nettoyage de l'ancienne langue sauvegardée (pour forcer le choix)
        const settings = storage.getSettings() || {};
        if (settings.language) {
            delete settings.language;
            storage.saveSettings(settings);
            Logger.info('🗑️ Saved language deleted');
        }
        
        // Aucune langue présélectionnée - les boutons restent désactivés
        Logger.info('🚀 ETEO V2 - Home ready!');
        Logger.info(`📊 ${Object.keys(LANG_CONFIG).length} languages available`);
        console.log('📢 TTS Module loaded and ready!');
        console.log('🌐 Select a language to activate buttons.');
        console.log('✅ All interface texts will be updated dynamically');
        
        // ============================================================
        // GESTION DE L'ICÔNE (fallback) — ✅ CORRIGÉ
        // ============================================================
        
        const logo = document.querySelector('.logo-eteo');
        if (logo) {
            logo.addEventListener('error', () => {
                logo.style.display = 'none';
                const container = document.querySelector('.logo-container');
                container.innerHTML = `
                    <div class="logo-text-fallback">
                        <span class="letter-e">E</span>
                        <span class="letter-t">T</span>
                        <span class="letter-e">E</span>
                        <span class="letter-o">O</span>
                    </div>
                    <p class="subtitle" id="subtitleText">E-learning To Every One</p>
                `;
                // ✅ Correction : réattacher l'écouteur au nouveau subtitleText
                const newSubtitle = document.getElementById('subtitleText');
                if (newSubtitle && selectedLang) {
                    newSubtitle.textContent = LANG_CONFIG[selectedLang].ui.subtitle;
                }
                Logger.warn('⚠️ ETEO icon not found, fallback to text');
            });
        }
        
    </script>
</body>
</html>
