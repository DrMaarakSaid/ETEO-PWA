<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ETEO - Mein Fortschritt</title>
    
    <link rel="stylesheet" href="../css/style.css">
    
    <script type="importmap">
    {
        "imports": {
            "../js/": "../js/",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
            "jspdf": "https://cdn.skypack.dev/jspdf@2.5.1",
            "qrcode": "https://cdn.skypack.dev/qrcode@1.5.3"
        }
    }
    </script>
</head>
<body>
    <div class="container progression-container">
        
        <!-- ============================================================ -->
        <!-- NAVIGATION OBEN -->
        <!-- ============================================================ -->
        <div class="nav-top">
            <button class="back-btn" onclick="window.location.href='dashboard.html'">
                ← Zurück
            </button>
            <button class="back-btn" onclick="window.location.href='../index.html'">
                🏠 Startseite
            </button>
        </div>

        <!-- ============================================================ -->
        <!-- HEADER -->
        <!-- ============================================================ -->
        <div class="progression-header">
            <h1>📊 Mein ETEO-Fortschritt 📈</h1>
            <p>Verfolgen Sie Ihre Entwicklung Level für Level</p>
        </div>

        <!-- ============================================================ -->
        <!-- KI-BEGRÜSSUNG (ZENTRIERT) -->
        <!-- ============================================================ -->
        <div class="ia-greeting" id="iaGreeting" style="display: flex; flex-direction: column; align-items: center; text-align: center;">
            <div class="ia-avatar" style="display: block; text-align: center;">🤖</div>
            <div style="width: 100%; text-align: center;">
                <p class="ia-message" id="iaProgressionMessage" style="text-align: center; width: 100%;">Nachricht wird geladen...</p>
                <button class="listen-btn-small" id="listenProgressionBtn" style="display: inline-block; margin: 8px auto 0;">🔊 Anhören</button>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- TABS -->
        <!-- ============================================================ -->
        <div class="progression-tabs">
            <button class="tab-btn active" data-tab="progression" id="tabProgression">
                📊 Fortschritt
            </button>
            <button class="tab-btn" data-tab="certificates" id="tabCertificates">
                📜 Zertifikate
            </button>
        </div>

        <!-- ============================================================ -->
        <!-- FORTSCHRITTS-CONTAINER -->
        <!-- ============================================================ -->
        <div id="progressionContainer" class="tab-content">
            <!-- Von ProgressionManager gefüllt -->
        </div>

        <!-- ============================================================ -->
        <!-- ZERTIFIKATS-CONTAINER -->
        <!-- ============================================================ -->
        <div id="certificatesContainer" class="tab-content" style="display:none;">
            <!-- Von CertificateManager gefüllt -->
        </div>

        <!-- ============================================================ -->
        <!-- NAVIGATION UNTEN (DUPLIZIERT) -->
        <!-- ============================================================ -->
        <div class="nav-bottom">
            <button class="back-btn" onclick="window.location.href='dashboard.html'">
                ← Zurück
            </button>
            <button class="back-btn" onclick="window.location.href='../index.html'">
                🏠 Startseite
            </button>
        </div>

        <!-- ============================================================ -->
        <!-- FOOTER -->
        <!-- ============================================================ -->
        <div class="footer">
            <p>📊 Fortschritt in Echtzeit • Mit Ihrem Konto synchronisiert</p>
            <p>© 2026 - ETEO Dental Education | 🇲🇦 Dr. SAID MAARAK</p>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- TOAST -->
    <!-- ============================================================ -->
    <div class="toast" id="toast"></div>

    <!-- ============================================================ -->
    <!-- HAUPT-SKRIPT -->
    <!-- ============================================================ -->
    
    <script type="module">
        // ============================================================
        // IMPORTS
        // ============================================================
        
        import { Logger } from '../js/logger.js';
        import { initializeApp } from 'firebase/app';
        import { getAuth, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore } from 'firebase/firestore';
        import { ProgressionService } from '../js/services/progressionService.js';
        import { ProgressionManager } from '../js/ui/ProgressionManager.js';
        import { CertificateService } from '../js/services/certificateService.js';
        import { CertificateManager } from '../js/ui/CertificateManager.js';
        import tts from '../js/services/tts.js';
        
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        
        const firebaseConfig = {
            apiKey: "AIzaSyDcIvbmmqiEqWbjNqTUwx1JGWkj6dxK-DE",
            authDomain: "eteo-endo-to-every-one.firebaseapp.com",
            databaseURL: "https://eteo-endo-to-every-one-default-rtdb.firebaseio.com",
            projectId: "eteo-endo-to-every-one",
            storageBucket: "eteo-endo-to-every-one.firebasestorage.app",
            messagingSenderId: "511524282020",
            appId: "1:511524282020:web:5a25c021fd84f026969031"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        window.tts = tts;
        
        // ============================================================
        // DOM ELEMENTS
        // ============================================================
        
        const toast = document.getElementById('toast');
        const progressionContainer = document.getElementById('progressionContainer');
        const certificatesContainer = document.getElementById('certificatesContainer');
        const tabProgression = document.getElementById('tabProgression');
        const tabCertificates = document.getElementById('tabCertificates');
        const iaMessage = document.getElementById('iaProgressionMessage');
        const listenBtn = document.getElementById('listenProgressionBtn');
        
        // ============================================================
        // TOAST
        // ============================================================
        
        function showToast(message, duration = 2500) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }
        
        // ============================================================
        // BEREINIGUNG VON EMOJIS FÜR DAS TTS
        // ============================================================
        
        function cleanTextForTTS(text) {
            if (!text) return '';
            let cleaned = text.replace(/[\u{1F000}-\u{1FFFF}]/gu, '');
            cleaned = cleaned.replace(/[⭐🌟🔥💎🎯🎉💪🧠📚📖🔊✅❌⏰🎰🦷🔪✨🔩👄👶💉🖨️📸📷🧼🔧🏥📊📋💰🏛️📈💻🛡️🌍👩‍⚕️📜🤝⚖️🎓📇👴🧪🎡👆]/g, '');
            cleaned = cleaned.replace(/[""]/g, '"');
            cleaned = cleaned.replace(/['']/g, "'");
            cleaned = cleaned.replace(/\s+/g, ' ').trim();
            return cleaned;
        }
        
        // ============================================================
        // KI-NACHRICHT GENERIEREN
        // ============================================================
        
        function generateIAMessage() {
            try {
                const settings = JSON.parse(localStorage.getItem('eteo_settings') || '{}');
                const userName = settings.user?.fullName || 'Doktor';
                
                const message = `
                    Hallo <strong>${userName}</strong> ! 👋<br>
                    📊 Willkommen auf Ihrer Fortschrittsseite.<br><br>
                    Hier sehen Sie alle Ihre Fachgebiete, Ihre Punktzahlen und Ihre Zertifikate.<br>
                    Jedes Fachgebiet hat <strong>6 Levels</strong>.<br>
                    Die <span style="color: #4caf50;">✅ grünen</span> sind bestanden, die <span style="color: #888;">🔒 grauen</span> müssen freigeschaltet werden.<br><br>
                    🎯 Schließen Sie alle Levels ab, um ein <strong>Zertifikat</strong> zu erhalten !<br><br>
                    Also, bereit, Fortschritte zu machen ? 🚀
                `;
                
                const ttsMessage = `
                    Hallo ${userName}. Willkommen auf Ihrer Fortschrittsseite.
                    Hier sehen Sie alle Ihre Fachgebiete, Ihre Punktzahlen und Ihre Zertifikate.
                    Jedes Fachgebiet hat 6 Levels. Die grünen sind bestanden, die grauen müssen freigeschaltet werden.
                    Schließen Sie alle Levels ab, um ein Zertifikat zu erhalten.
                    Also, bereit, Fortschritte zu machen ?
                `;
                
                iaMessage.innerHTML = message;
                window._ttsProgressionMessage = cleanTextForTTS(ttsMessage);
                
                if (listenBtn) {
                    listenBtn.style.display = 'inline-block';
                }
                
                setTimeout(() => autoSpeak(), 1200);
                
            } catch (error) {
                console.error('❌ Fehler bei der KI-Generierung:', error);
                iaMessage.innerHTML = '⚠️ Nachricht nicht verfügbar. Laden Sie die Seite neu.';
            }
        }
        
        // ============================================================
        // AUTO-VORLESEN
        // ============================================================
        
        let isAutoSpeaking = false;
        
        function autoSpeak() {
            if (!window.tts || isAutoSpeaking) return;
            isAutoSpeaking = true;
            const text = window._ttsProgressionMessage || '';
            if (!text) { isAutoSpeaking = false; return; }
            
            if (listenBtn) {
                listenBtn.textContent = '⏹️ Stoppen';
                listenBtn.classList.add('listening');
            }
            
            window.tts.speak(text, 'de', 0.9, 1.0,
                () => {
                    if (listenBtn) {
                        listenBtn.textContent = '🔊 Anhören';
                        listenBtn.classList.remove('listening');
                    }
                    isAutoSpeaking = false;
                },
                () => {
                    if (listenBtn) {
                        listenBtn.textContent = '🔊 Anhören';
                        listenBtn.classList.remove('listening');
                    }
                    isAutoSpeaking = false;
                }
            );
        }
        
        // ============================================================
        // BUTTON "ANHÖREN"
        // ============================================================
        
        listenBtn.addEventListener('click', function() {
            if (!window.tts) return showToast('❌ TTS nicht verfügbar', 3000);
            
            if (window.tts.isSpeakingNow()) {
                window.tts.stop();
                this.textContent = '🔊 Anhören';
                this.classList.remove('listening');
                isAutoSpeaking = false;
                return;
            }
            
            const text = window._ttsProgressionMessage || '';
            if (!text) return showToast('⚠️ Nachricht nicht verfügbar', 3000);
            
            this.textContent = '⏹️ Stoppen';
            this.classList.add('listening');
            
            window.tts.speak(text, 'de', 0.9, 1.0,
                () => {
                    this.textContent = '🔊 Anhören';
                    this.classList.remove('listening');
                },
                () => {
                    this.textContent = '🔊 Anhören';
                    this.classList.remove('listening');
                    showToast('❌ Lesefehler', 3000);
                }
            );
        });
        
        // ============================================================
        // TAB-VERWALTUNG
        // ============================================================
        
        function setupTabs() {
            if (tabProgression) {
                tabProgression.addEventListener('click', function() {
                    tabProgression.classList.add('active');
                    tabCertificates.classList.remove('active');
                    progressionContainer.style.display = 'block';
                    certificatesContainer.style.display = 'none';
                });
            }
            
            if (tabCertificates) {
                tabCertificates.addEventListener('click', function() {
                    tabCertificates.classList.add('active');
                    tabProgression.classList.remove('active');
                    certificatesContainer.style.display = 'block';
                    progressionContainer.style.display = 'none';
                });
            }
        }
        
        // ============================================================
        // INITIALISIERUNG
        // ============================================================
        
        async function init() {
            Logger.info('📊 Fortschrittsseite geladen');
            
            setupTabs();
            generateIAMessage();
            
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const uid = user.uid;
                    
                    const progressionService = new ProgressionService();
                    const certificateService = new CertificateService();
                    
                    const progressionManager = new ProgressionManager(progressionService, showToast);
                    await progressionManager.loadProgression(progressionContainer, uid);
                    
                    const certificateManager = new CertificateManager(
                        certificateService,
                        progressionService,
                        showToast
                    );
                    await certificateManager.loadCertificates(certificatesContainer, uid);
                    
                    Logger.info('✅ Fortschritt und Zertifikate geladen');
                } else {
                    showToast('⚠️ Bitte melden Sie sich an, um Ihren Fortschritt zu sehen', 3000);
                    
                    const message = `
                        <div style="text-align: center; padding: 60px 20px;">
                            <div style="font-size: 3rem;">🔒</div>
                            <div style="font-size: 1.2rem; margin-top: 20px;">Melden Sie sich an, um Ihren Fortschritt zu sehen</div>
                            <div style="margin-top: 10px; color: #888;">Nur angemeldete Benutzer können auf ihren Fortschritt zugreifen</div>
                            <button onclick="window.location.href='inscription_de.html'" 
                                    style="margin-top: 20px; padding: 12px 40px; border: none; border-radius: 30px; 
                                           background: linear-gradient(135deg, #667eea, #764ba2); color: white; 
                                           cursor: pointer; font-weight: 700; font-size: 1rem;">
                                🔑 Anmelden / Registrieren
                            </button>
                        </div>
                    `;
                    
                    progressionContainer.innerHTML = message;
                    certificatesContainer.innerHTML = message;
                }
            });
        }
        
        init();
        
    </script>
</body>
</html>
